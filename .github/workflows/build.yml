name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash bin\SampleRateGuard.exe -Algorithm SHA256).Hash
          "$h  SampleRateGuard.exe" | Set-Content bin\SampleRateGuard.exe.sha256
          Get-Content bin\SampleRateGuard.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SampleRateGuard
          path: |
            bin/SampleRateGuard.exe
            bin/SampleRateGuard.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SampleRateGuard
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SampleRateGuard.exe SampleRateGuard.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Sample Rate Guard $GITHUB_REF_NAME" --generate-notes
